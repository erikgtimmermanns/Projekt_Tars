<!DOCTYPE html>
<html lang="de" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light">

  <!-- Google Font: Albert Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tablet/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module" src="./js/kiosk/app.js"></script>
</head>
<body>
    <main class="screen">
        <section id="visitor-btn-panel" class="visitor-btn-panel"></section>
    <aside class="tablet-tools" aria-label="Weitere Bereiche">
      <button
        class="widget-open"
        type="button"
        data-kiosk-view="alliance-comparison"
        aria-label="Allianzstatistik auf dem Kiosk öffnen"
        hidden
      >
        <span class="widget-open-icon" aria-hidden="true">⚓</span>
        <span class="widget-open-copy">
          <span class="widget-open-label">Seekampf</span>
          <span class="widget-open-action">Am Kiosk öffnen</span>
        </span>
        <span class="widget-open-arrow" aria-hidden="true">›</span>
      </button>
      <button
        class="widget-open"
        type="button"
        data-kiosk-view="nasa-apod"
        aria-label="NASA Picture of the Day auf dem Kiosk öffnen"
        hidden
      >
        <span class="widget-open-icon" aria-hidden="true">✦</span>
        <span class="widget-open-copy">
          <span class="widget-open-label">NASA Bild</span>
          <span class="widget-open-action">Am Kiosk öffnen</span>
        </span>
        <span class="widget-open-arrow" aria-hidden="true">›</span>
      </button>
      <button
        class="widget-open"
        type="button"
        data-kiosk-view="coud-chart"
        aria-label="COUD Aktienchart auf dem Kiosk öffnen"
        hidden
      >
        <span class="widget-open-icon" aria-hidden="true">↗</span>
        <span class="widget-open-copy">
          <span class="widget-open-label">COUD Chart</span>
          <span class="widget-open-action">Am Kiosk öffnen</span>
        </span>
        <span class="widget-open-arrow" aria-hidden="true">›</span>
      </button>
    </aside>
    <section id="coud-chart-controls" class="coud-chart-controls" aria-label="Zeitraum für COUD Aktienchart" hidden>
      <p>Zeitraum</p>
      <div class="coud-chart-range-list" role="group" aria-label="Chartzeitraum">
        <button type="button" data-coud-chart-range="1D">1T</button>
        <button type="button" data-coud-chart-range="1M">1M</button>
        <button type="button" data-coud-chart-range="3M">3M</button>
        <button type="button" data-coud-chart-range="12M">1J</button>
        <button type="button" data-coud-chart-range="60M">5J</button>
        <button type="button" data-coud-chart-range="ALL">Alle</button>
      </div>
    </section>
    <p id="selection-status" class="selection-status" role="status" aria-live="polite" hidden></p>
    </main>
</body>
