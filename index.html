<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="style.css">
  <title>Willkommen | Computacenter Düsseldorf</title>
  <!-- Google Font: Albert Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="screen">
    <!-- Obere Kopfzeile -->
    <header class="topbar">
      <!-- Offizielles Computacenter-Logo -->
      <div class="brand">
        <img
          src="./assets/Computacenter_logo.svg"
          alt="Offizielles Computacenter-Logo"
          class="brand-logo"
        >
      </div>
      <!-- Begrüßung -->
      <section class="headline" aria-label="Begrüßung">
        <p class="eyebrow">Herzlich willkommen</p>
        <h1>
          In unserer Geschäftsstelle
          <span>Düsseldorf</span>
        </h1>
      </section>
      <!-- Automatisches Datum und Uhrzeit -->
      <section class="datetime" aria-label="Datum und Uhrzeit">
        <div class="date" id="date">
          Montag, 07. September 2026
        </div>
        <div class="time" id="time">
          15:00 Uhr
        </div>
      </section>
    </header>
    <!-- Großer Begrüßungsbereich -->
    <section class="hero">
      <div class="hero-inner">
        <div id="weather">Wetter wird geladen...</div>
        <script> 
          async function loadWeather() {
          const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=51.2277&longitude=6.7735&current=temperature_2m,relative_humidity_2m%27');
          const data = await response.json();
          document.getElementById('weather').innerHTML ="🌤 Temperatur: ${data.current.temperature_2m} °C<br>💧 Luftfeuchtigkeit: ${data.current.relative_humidity_2m} %";
          }
        loadWeather();
        setInterval(loadWeather, 600000); // alle 10 Minuten aktualisieren
    </script>

 
      </div>
    </section>
    <!-- Fußzeile -->
    <footer class="footer">
      <span>
        <strong>Computacenter Deutschland</strong>
        · Geschäftsstelle Düsseldorf
      </span>
      <span class="status">
        Bitte melden Sie sich am Empfang an
      </span>
    </footer>
  </main>
  <script>
    function updateDateTime() {
      const now = new Date();
      const formattedDate = new Intl.DateTimeFormat("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).format(now);
      const formattedTime = new Intl.DateTimeFormat("de-DE", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
      document.getElementById("date").textContent =
        formattedDate;
      document.getElementById("time").textContent =
        formattedTime + " Uhr";
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>

</html>
